<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบ POS ร้านพิซซ่า - Production Grade</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans antialiased">

  <!-- Header Section -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-3xl">🍕</span>
        <div>
          <h1 class="text-xl font-bold leading-none">PIZZA POS SYSTEM</h1>
          <p class="text-xs text-slate-400 mt-1">Enterprise Order Management</p>
        </div>
      </div>
      <div id="network-badge" class="text-xs font-medium px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 flex items-center gap-2 border border-slate-700">
        <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span>
        Connecting Network...
      </div>
    </div>
  </header>

  <!-- Main Application Layout -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
    
    <!-- Left Section: Menu Grid -->
    <section class="lg:col-span-2">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-800">รายการเมนูอาหาร</h2>
        <span id="menu-counter" class="text-xs font-medium text-slate-500">0 รายการ</span>
      </div>
      
      <!-- Dynamic Container -->
      <div id="pizza-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Skeleton Loading initial state -->
        <div class="bg-white p-5 rounded-xl border border-slate-200 animate-pulse h-36"></div>
        <div class="bg-white p-5 rounded-xl border border-slate-200 animate-pulse h-36"></div>
      </div>
    </section>

    <!-- Right Section: Order Cart -->
    <section class="lg:col-span-1">
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 sticky top-20 overflow-hidden">
        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
          <h2 class="font-bold text-slate-800 flex items-center gap-2">
            <span>🛒</span> ออเดอร์หน้าร้าน
          </h2>
          <button onclick="clearCart()" class="text-xs text-slate-400 hover:text-red-600 transition">ล้างตะกร้า</button>
        </div>

        <!-- Cart Items -->
        <div id="cart-items" class="p-4 space-y-3 max-h-[380px] overflow-y-auto divide-y divide-slate-100">
          <div class="text-center py-12 text-slate-400 text-sm">ยังไม่มีรายการในตะกร้า</div>
        </div>

        <!-- Summary & Checkout -->
        <div class="p-4 bg-slate-50 border-t border-slate-200 space-y-2">
          <div class="flex justify-between text-sm text-slate-600">
            <span>รวมจำนวน</span>
            <span id="total-qty" class="font-semibold text-slate-800">0 ชิ้น</span>
          </div>
          <div class="flex justify-between text-xl font-bold text-slate-900 pt-2 border-t border-slate-200">
            <span>ยอดชำระสุทธิ</span>
            <span id="total-price" class="text-orange-600">฿0</span>
          </div>
          
          <button onclick="checkout()" class="w-full mt-3 bg-orange-600 hover:bg-orange-700 active:scale-[0.99] text-white font-bold py-3 rounded-lg shadow transition duration-150 flex justify-center items-center gap-2">
            <span>💳</span> ชำระเงิน / บันทึกออเดอร์
          </button>
        </div>
      </div>
    </section>

  </main>

  <script>
    const SUPABASE_URL = "https://nvujrjyfdhovfstaetn.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im52dWpyanlmZGh2b3Zmc3RhZXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxMzk0NjUsImV4cCI6MjEwMjcxNTQ2NX0.RfejicnaDd79x5rDPO2elRKnXFwxF-h_ywDWZE8jktY";

    // Initialize Supabase Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let cart = {};

    // Fetch live menu from Network Database
    async function fetchMenuFromNetwork() {
      const container = document.getElementById('pizza-container');
      const badge = document.getElementById('network-badge');
      const counter = document.getElementById('menu-counter');

      // Update status UI
      badge.className = "text-xs font-medium px-3 py-1.5 rounded-full bg-yellow-500/20 text-yellow-300 border border-yellow-500/30 flex items-center gap-2";
      badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></span> Fetching API...`;

      try {
        const { data, error } = await supabaseClient
          .from('menu_items')
          .select('*');

        if (error) throw error;

        // Render Database Data
        container.innerHTML = '';
        counter.textContent = `${data.length} รายการ`;

        data.forEach(item => {
          const itemPrice = item.price || item.base_price || 199;
          const card = document.createElement('div');
          card.className = "bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between";
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-2">
                <h3 class="font-bold text-slate-800 text-lg">${item.name}</h3>
                <span class="bg-orange-50 text-orange-600 font-bold px-2.5 py-1 rounded-md text-sm">฿${itemPrice}</span>
              </div>
              <p class="text-slate-500 text-xs leading-relaxed mb-4">${item.description || 'ไม่มีรายละเอียดระบุไว้'}</p>
            </div>
            <button onclick="addToCart('${item.id}', '${item.name}', ${itemPrice})" 
                    class="w-full bg-slate-900 hover:bg-orange-600 active:scale-[0.98] text-white font-medium py-2.5 rounded-lg text-sm transition flex justify-center items-center gap-1.5">
              <span>+</span> เพิ่มในออเดอร์
            </button>
          `;
          container.appendChild(card);
        });

        // Network Success Badge
        badge.className = "text-xs font-medium px-3 py-1.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 flex items-center gap-2";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Network Online (Supabase)`;

      } catch (err) {
        // Handle Network / CORS Error cleanly
        counter.textContent = "0 รายการ";
        badge.className = "text-xs font-medium px-3 py-1.5 rounded-full bg-red-500/20 text-red-300 border border-red-500/30 flex items-center gap-2";
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-400"></span> Network Error`;

        container.innerHTML = `
          <div class="bg-white p-6 rounded-xl border border-red-200 col-span-2 text-center space-y-3 shadow-sm">
            <div class="text-red-500 text-4xl">⚠️</div>
            <h3 class="font-bold text-slate-800">เชื่อมต่อฐานข้อมูลไม่สำเร็จ</h3>
            <p class="text-xs text-slate-500 max-w-md mx-auto">
              เปิดไฟล์โดยตรงจากเครื่อง (file://) อาจถูกเบราว์เซอร์บล็อก Network API <br>
              คำแนะนำ: ให้รันผ่าน Live Server หรือ Web Server
            </p>
            <button onclick="fetchMenuFromNetwork()" class="bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-lg hover:bg-slate-800 transition">
              🔄 ลองเชื่อมต่ออีกครั้ง
            </button>
          </div>
        `;
      }
    }

    // Cart Core Logic
    function addToCart(id, name, price) {
      if (cart[id]) cart[id].qty += 1;
      else cart[id] = { name, price, qty: 1 };
      updateCartUI();
    }

    function updateQty(id, delta) {
      if (!cart[id]) return;
      cart[id].qty += delta;
      if (cart[id].qty <= 0) delete cart[id];
      updateCartUI();
    }

    function clearCart() {
      cart = {};
      updateCartUI();
    }

    function updateCartUI() {
      const container = document.getElementById('cart-items');
      const keys = Object.keys(cart);

      if (keys.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">ยังไม่มีรายการในตะกร้า</div>';
        document.getElementById('total-qty').textContent = '0 ชิ้น';
        document.getElementById('total-price').textContent = '฿0';
        return;
      }

      let totalQty = 0;
      let totalPrice = 0;
      container.innerHTML = '';

      keys.forEach(id => {
        const item = cart[id];
        const subtotal = item.price * item.qty;
        totalQty += item.qty;
        totalPrice += subtotal;

        const row = document.createElement('div');
        row.className = "pt-3 flex justify-between items-center";
        row.innerHTML = `
          <div class="flex-1 pr-2">
            <h4 class="font-semibold text-sm text-slate-800 leading-tight">${item.name}</h4>
            <span class="text-xs text-slate-500">฿${item.price} × ${item.qty} = <b class="text-slate-700">฿${subtotal}</b></span>
          </div>
          <div class="flex items-center gap-1.5 bg-slate-100 p-1 rounded-lg">
            <button onclick="updateQty('${id}', -1)" class="w-6 h-6 bg-white shadow-sm rounded text-slate-700 font-bold text-xs hover:bg-slate-200 transition">-</button>
            <span class="w-5 text-center text-xs font-bold text-slate-800">${item.qty}</span>
            <button onclick="updateQty('${id}', 1)" class="w-6 h-6 bg-white shadow-sm rounded text-slate-700 font-bold text-xs hover:bg-slate-200 transition">+</button>
          </div>
        `;
        container.appendChild(row);
      });

      document.getElementById('total-qty').textContent = `${totalQty} ชิ้น`;
      document.getElementById('total-price').textContent = `฿${totalPrice}`;
    }

    function checkout() {
      if (Object.keys(cart).length === 0) return alert('กรุณาเลือกรายการอาหารก่อนทำรายการครับ');
      const finalPrice = document.getElementById('total-price').textContent;
      alert(`🎉 ชำระเงินสำเร็จ!\nยอดชำระเงินสุทธิ: ${finalPrice}`);
      clearCart();
    }

    // App Startup
    fetchMenuFromNetwork();
  </script>
</body>
</html>
